<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Dimi ❤️</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #121213;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100vh;
    margin: 0;
}

h1 {
    margin-bottom: 20px;
}

#board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 8px;
}

.row {
    display: grid;
    grid-template-columns: repeat(5, 60px);
    gap: 8px;
}

.tile {
    width: 60px;
    height: 60px;
    border: 2px solid #3a3a3c;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    font-weight: bold;
    text-transform: uppercase;
}

.correct {
    background: #538d4e;
    border-color: #538d4e;
}

.present {
    background: #b59f3b;
    border-color: #b59f3b;
}

.absent {
    background: #3a3a3c;
    border-color: #3a3a3c;
}

input {
    margin-top: 20px;
    padding: 10px;
    font-size: 18px;
    text-transform: uppercase;
    text-align: center;
    width: 140px;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

#message {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>Guess the Word</h1>

<div id="board"></div>

<input id="guess" maxlength="5" placeholder="5 letters">
<button onclick="submitGuess()">Guess</button>

<div id="message"></div>

<script>
const answer = "SORRY";
const board = document.getElementById("board");
let attempts = 0;

for (let i = 0; i < 6; i++) {
    const row = document.createElement("div");
    row.className = "row";

    for (let j = 0; j < 5; j++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        row.appendChild(tile);
    }

    board.appendChild(row);
}

function submitGuess() {
    if (attempts >= 6) return;

    const input = document.getElementById("guess");
    const guess = input.value.toUpperCase();

    if (guess.length !== 5) {
        alert("Enter exactly 5 letters.");
        return;
    }

    const row = board.children[attempts];
    const answerLetters = answer.split("");

    for (let i = 0; i < 5; i++) {
        const tile = row.children[i];
        tile.textContent = guess[i];

        if (guess[i] === answer[i]) {
            tile.classList.add("correct");
        } else if (answerLetters.includes(guess[i])) {
            tile.classList.add("present");
        } else {
            tile.classList.add("absent");
        }
    }

    if (guess === answer) {
        document.getElementById("message").textContent =
            "❤️ You guessed it! The word was SORRY.";
        input.disabled = true;
        return;
    }

    attempts++;
    input.value = "";

    if (attempts === 6) {
        document.getElementById("message").textContent =
            "The word was SORRY ❤️";
        input.disabled = true;
    }
}
</script>

</body>
</html>
